name: Update movie data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.js
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "cineradar-bot"
          git config user.email "bot@cineradar.local"
          git add public/data/enriched.json
          git commit -m "Update movie data" || echo "Rien à mettre à jour"
          git push
