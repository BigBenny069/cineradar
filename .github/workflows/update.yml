name: Update movie data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "data/movies.json"
permissions:
  contents: write

# Empêche deux passages du robot de tourner en même temps (ex: plusieurs
# suppressions rapprochées déclenchent chacune un nouveau passage) — les
# déclenchements successifs sont mis en file d'attente plutôt que de
# s'exécuter en parallèle et de se marcher dessus.
concurrency:
  group: update-movie-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Calcul puis envoi (avec nouveau calcul complet en cas de collision)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          git config user.name "cineradar-bot"
          git config user.email "bot@cineradar.local"

          for i in 1 2 3 4 5; do
            echo "=== Tentative $i/5 ==="
            # "|| node_exit=$?" empêche le -e implicite de GitHub Actions de
            # tuer le step immédiatement en cas d'échec du script : on veut
            # quand même committer la trace laissée dans last-run.json avant
            # de faire échouer le job.
            node_exit=0
            node scripts/update.cjs || node_exit=$?

            git add public/data/enriched.json public/data/unmatched.json public/data/history.json public/data/watchlist-review.json public/data/deletion-log.json public/data/last-run.json data/movies.json
            git commit -m "Update movie data" || { echo "Rien à mettre à jour."; exit $node_exit; }

            if git push; then
              echo "Push réussi (tentative $i)."
              exit $node_exit
            fi

            echo "Push rejeté (tentative $i/5) — un commit a été fait entre-temps (ex: modification via l'app)."
            echo "Plutôt que de fusionner deux versions calculées séparément (risque de conflit sur enriched.json),"
            echo "on repart de la toute dernière version et on refait le calcul en entier."
            git fetch origin main
            git reset --hard origin/main
            sleep 3
          done

          echo "Échec après 5 tentatives."
          exit 1
